<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCI Dialysis Center - Staff Break Tracker</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SCI Break Tracker">
<meta name="theme-color" content="#0284c7">

<!-- iOS Safari Icon Links (Handles precomposed and standard requests) -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">
<link rel="shortcut icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">

<!-- html2pdf Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root {
--primary: #0284c7;
--primary-dark: #0369a1;
--success: #16a34a;
--danger: #dc2626;
--warning: #d97706;
--bg: #f8fafc;
--card-bg: #ffffff;
--text: #1e293b;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

body { background: var(--bg); color: var(--text); padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

.staff-container { width: 100%; max-width: 400px; background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }

.app-logo { width: 60px; height: 60px; background: #e0f2fe; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; color: var(--primary); box-shadow: 0 4px 10px rgba(2, 132, 199, 0.15); }
.app-logo svg { width: 28px; height: 28px; fill: currentColor; }

.org-title { font-size: 12px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; line-height: 1.4; }
.staff-container h2 { color: var(--text); margin-bottom: 3px; font-size: 22px; }
.staff-subtitle { color: #64748b; font-size: 13px; margin-bottom: 15px; }

.live-clock-badge { background: #f1f5f9; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #475569; display: inline-block; margin-bottom: 15px; border: 1px solid #e2e8f0; }

.timer-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; text-align: left; }
.timer-card span { font-size: 13px; color: #475569; font-weight: 600; }
.timer-card .times { font-size: 13px; color: var(--text); text-align: right; }
.timer-card .duration { font-size: 12px; color: var(--primary); font-weight: bold; margin-top: 3px; }

.total-box { background: #e0f2fe; padding: 12px; border-radius: 10px; margin-top: 15px; font-weight: bold; color: var(--primary-dark); font-size: 15px; display: flex; justify-content: space-between; align-items: center; }

/* Slide Button Styles */
.slide-container {
  position: relative;
  width: 100%;
  height: 60px;
  background-color: var(--success);
  border-radius: 30px;
  margin-top: 20px;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
  transition: background-color 0.3s, box-shadow 0.3s;
}

.slide-container.end-mode {
  background-color: var(--danger);
  box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
}

.slide-container.disabled {
  background-color: #cbd5e1;
  box-shadow: none;
  cursor: not-allowed;
}

.slide-text {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: bold;
  font-size: 16px;
  letter-spacing: 0.5px;
  pointer-events: none;
  padding-left: 20px;
}

.slide-handle {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 52px;
  height: 52px;
  background-color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--success);
  font-size: 20px;
  font-weight: bold;
  cursor: grab;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  transition: left 0.1s ease-out;
  z-index: 2;
}

.slide-container.end-mode .slide-handle {
  color: var(--danger);
}

.incharge-btn { display: block; width: 100%; padding: 14px; font-size: 15px; font-weight: 600; color: white; background: var(--primary); border: none; border-radius: 12px; cursor: pointer; margin-top: 20px; transition: 0.2s; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2); }
.incharge-btn:hover { background: var(--primary-dark); }

.incharge-container { width: 100%; max-width: 1000px; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
.incharge-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
.incharge-header-left { display: flex; align-items: center; gap: 15px; }
.incharge-header-left .app-logo { margin: 0; width: 50px; height: 50px; }
.incharge-header-left .app-logo svg { width: 22px; height: 22px; }

.staff-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; margin-bottom: 25px; }
.staff-dashboard-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 14px; text-align: left; box-shadow: 0 2px 6px rgba(0,0,0,0.02); display: flex; flex-direction: column; justify-content: space-between; }
.staff-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.staff-card-name { font-size: 16px; font-weight: bold; color: var(--text); }

.dashboard-break-info { background: #ffffff; border: 1px solid #e2e8f0; padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; font-size: 12.5px; display: flex; justify-content: space-between; align-items: center; }
.dashboard-break-info b { color: var(--text); }
.dashboard-total-box { background: #e0f2fe; padding: 10px 12px; border-radius: 10px; font-weight: bold; color: var(--primary-dark); font-size: 13.5px; display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }

.status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
.badge-bs { background: #e2e8f0; color: #475569; }
.badge-be { background: #fee2e2; color: var(--danger); }
.badge-ls { background: #fef3c7; color: var(--warning); }
.badge-le { background: #fee2e2; color: var(--danger); }
.badge-done { background: #dcfce7; color: var(--success); }

.incharge-controls { background: #f1f5f9; padding: 18px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border: 1px solid #cbd5e1; }
.incharge-controls select { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; font-weight: 600; outline: none; }

.history-view { text-align: left; }
.history-title-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }

.filter-box { background: #f8fafc; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 15px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
.filter-box label { font-size: 13px; font-weight: 600; color: #475569; }
.filter-box input { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
.btn-pdf { background: var(--danger); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600; }
.btn-pdf:hover { background: #b91c1c; }

.table-responsive { overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 20px; }
table { width: 100%; border-collapse: collapse; background: white; }
th, td { padding: 12px 14px; text-align: center; font-size: 13px; }
th { background: var(--primary); color: white; font-weight: 600; }
tr:not(:last-child) td { border-bottom: 1px solid #f1f5f9; }
tr:nth-child(even) { background: #f8fafc; }

.btn-back { background: #64748b; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }

/* Modal Styles */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
.modal-box { background: white; padding: 25px; border-radius: 16px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
.modal-box h3 { margin-bottom: 15px; color: var(--text); font-size: 18px; }
.modal-input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; margin-bottom: 15px; outline: none; text-align: center; }
.modal-input:focus { border-color: var(--primary); }
.modal-btns { display: flex; gap: 10px; }
.modal-btn { flex: 1; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; font-size: 14px; }
.modal-btn-confirm { background: var(--primary); color: white; }
.modal-btn-cancel { background: #e2e8f0; color: #475569; }

.loading-text { text-align: center; color: #64748b; padding: 20px; font-size: 15px; }
</style>
</head>
<body>

<div id="mainApp" style="width: 100%; display: flex; justify-content: center;">
<div class="loading-text">Connecting to server...</div>
</div>

<script>
const plateCutleryIconSVG = `<svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.21 1.79 4 4 4v9h2v-9c2.21 0 4-1.79 4-4V2h-2v7zm10-7v20h-2v-7h-1v-2h1V2h2z"/></svg>`;

let globalTimerInterval = null;
const INCHARGE_PASSWORD = "sci123";

const STAFF_LIST = [
"Muhthar Panaghattayil",
"Arya R Ashok",
"Aji Varghese",
"Merin Joseph",
"Jyothimol Alex",
"Afsina Vadakke Eranjoli"
];

function parseTimeToDate(timeStr) {
if (!timeStr || timeStr === '--:--') return null;
let [h, m, s] = timeStr.split(':').map(Number);
let d = new Date();
d.setHours(h || 0, m || 0, s || 0, 0);
return d;
}

function formatDuration(diffMs) {
if (diffMs <= 0) return '0m 0s';
let totalSecs = Math.floor(diffMs / 1000);
let hrs = Math.floor(totalSecs / 3600);
let mins = Math.floor((totalSecs % 3600) / 60);
let secs = totalSecs % 60;
if (hrs > 0) return `${hrs}h ${mins}m ${secs}s`;
if (mins > 0) return `${mins}m ${secs}s`;
return `${secs}s`;
}

function calculateStaticDuration(startStr, endStr) {
let sDate = parseTimeToDate(startStr);
let eDate = parseTimeToDate(endStr);
if (!sDate || !eDate) return '0 mins';
let diff = eDate - sDate;
if (diff < 0) diff += 24 * 3600 * 1000;
let totalMins = Math.floor(diff / 60000);
let hrs = Math.floor(totalMins / 60);
let mins = totalMins % 60;
if (hrs > 0) return `${hrs}h ${mins}m`;
return `${mins} mins`;
}

function getMinutes(startStr, endStr) {
let sDate = parseTimeToDate(startStr);
let eDate = parseTimeToDate(endStr);
if (!sDate || !eDate) return 0;
let diff = eDate - sDate;
if (diff < 0) diff += 24 * 3600 * 1000;
return Math.floor(diff / 60000);
}

// Main App Initialization Function
function initApp() {
const urlParams = new URLSearchParams(window.location.search);
const role = urlParams.get('role');
const viewStaffHistory = urlParams.get('staff_history');

let rawName = urlParams.get('name');
let staffName = null;
if (rawName) {
staffName = decodeURIComponent(rawName.replace(/\+/g, ' '));
}

const mainApp = document.getElementById('mainApp');
const todayDate = new Date().toISOString().split('T')[0];

if (role === 'incharge') {
if (viewStaffHistory) {
let targetStaff = decodeURIComponent(viewStaffHistory.replace(/\+/g, ' '));
renderStaffHistoryView(targetStaff, mainApp, todayDate);
} else {
renderInchargeDashboard(mainApp, todayDate);
}
} else if (staffName) {
renderStaffView(staffName, mainApp, todayDate);
} else {
renderInchargeDashboard(mainApp, todayDate);
}
}

function renderStaffView(name, mainApp, todayDate) {
const dataRef = window.dbRef(window.db, 'breaks/' + todayDate + '/' + name);

window.dbOnValue(dataRef, (snapshot) => {
let staff = snapshot.val();
if (!staff) {
staff = { bStart: '--:--', bEnd: '--:--', lStart: '--:--', lEnd: '--:--', status: 'BS', bStartTimeFull: null, lStartTimeFull: null };
window.dbSet(dataRef, staff);
}

if (globalTimerInterval) clearInterval(globalTimerInterval);

let initialBDur = staff.bStart !== '--:--' && staff.bEnd !== '--:--' ? calculateStaticDuration(staff.bStart, staff.bEnd) : '0 mins';
let initialLDur = staff.lStart !== '--:--' && staff.lEnd !== '--:--' ? calculateStaticDuration(staff.lStart, staff.lEnd) : '0 mins';

let btnText = "Slide to Start Breakfast";
let isEndMode = false;
let isDisabled = false;

if (staff.status === 'BS') { btnText = "Slide to Start Breakfast"; }
else if (staff.status === 'BE') { btnText = "Slide to End Breakfast"; isEndMode = true; }
else if (staff.status === 'LS') { btnText = "Slide to Start Lunch"; }
else if (staff.status === 'LE') { btnText = "Slide to End Lunch"; isEndMode = true; }
else { btnText = "All Breaks Completed"; isDisabled = true; }

mainApp.innerHTML = `
<div class="staff-container">
<div class="app-logo">${plateCutleryIconSVG}</div>
<div class="org-title">Sharjah Charity International<br>Dialysis Center</div>
<h2>${name}</h2>
<p class="staff-subtitle">Staff Break Tracker</p>

<div class="live-clock-badge" id="liveClockDisplay">Current Time: --:--:--</div>

<div class="timer-card">
<div>
<span>Breakfast Break</span>
<div class="duration" id="bDurationDisplay">Duration: ${initialBDur}</div>
</div>
<div class="times">
Start: <b id="bStartVal">${staff.bStart}</b><br>
End: <b id="bEndVal">${staff.bEnd}</b>
</div>
</div>

<div class="timer-card">
<div>
<span>Lunch Break</span>
<div class="duration" id="lDurationDisplay">Duration: ${initialLDur}</div>
</div>
<div class="times">
Start: <b id="lStartVal">${staff.lStart}</b><br>
End: <b id="lEndVal">${staff.lEnd}</b>
</div>
</div>

<div class="total-box">
<span>Total Break Time:</span>
<span id="totalDurationDisplay">0m 0s</span>
</div>

<div class="slide-container ${isEndMode ? 'end-mode' : ''} ${isDisabled ? 'disabled' : ''}" id="slideTrack">
  <div class="slide-text">${btnText}</div>
  <div class="slide-handle" id="slideHandle">${isDisabled ? '✓' : '&gt;&gt;'}</div>
</div>
</div>
`;

globalTimerInterval = setInterval(() => {
let now = new Date();
let clockEl = document.getElementById('liveClockDisplay');
if (clockEl) {
clockEl.innerText = `Current Time: ${now.toLocaleTimeString()}`;
}

let bDurText = '0 mins';
if (staff.bStart !== '--:--' && staff.bEnd !== '--:--') {
bDurText = calculateStaticDuration(staff.bStart, staff.bEnd);
} else if (staff.status === 'BE' && staff.bStartTimeFull) {
let diff = now - new Date(staff.bStartTimeFull);
bDurText = formatDuration(diff);
}

let lDurText = '0 mins';
if (staff.lStart !== '--:--' && staff.lEnd !== '--:--') {
lDurText = calculateStaticDuration(staff.lStart, staff.lEnd);
} else if (staff.status === 'LE' && staff.lStartTimeFull) {
let diff = now - new Date(staff.lStartTimeFull);
lDurText = formatDuration(diff);
}

let totalMs = 0;
if (staff.bStart !== '--:--' && staff.bEnd !== '--:--') {
let s = parseTimeToDate(staff.bStart), e = parseTimeToDate(staff.bEnd);
let d = e - s; if(d < 0) d += 24*3600*1000; totalMs += d;
} else if (staff.status === 'BE' && staff.bStartTimeFull) {
totalMs += (now - new Date(staff.bStartTimeFull));
}

if (staff.lStart !== '--:--' && staff.lEnd !== '--:--') {
let s = parseTimeToDate(staff.lStart), e = parseTimeToDate(staff.lEnd);
let d = e - s; if(d < 0) d += 24*3600*1000; totalMs += d;
} else if (staff.status === 'LE' && staff.lStartTimeFull) {
totalMs += (now - new Date(staff.lStartTimeFull));
}

let totalDurationStr = formatDuration(totalMs);

let bEl = document.getElementById('bDurationDisplay');
let lEl = document.getElementById('lDurationDisplay');
let tEl = document.getElementById('totalDurationDisplay');

if (bEl) bEl.innerText = `Duration: ${bDurText}`;
if (lEl) lEl.innerText = `Duration: ${lDurText}`;
if (tEl) tEl.innerText = totalDurationStr;

}, 1000);

if (!isDisabled) {
  setupSlideAction(name, staff, todayDate);
}

}, { onlyOnce: false });
}

function setupSlideAction(name, staff, todayDate) {
  const track = document.getElementById('slideTrack');
  const handle = document.getElementById('slideHandle');
  if (!track || !handle) return;

  let isDragging = false;
  let startX = 0;
  let maxSlide = track.clientWidth - handle.clientWidth - 8;

  function onStart(e) {
    isDragging = true;
    startX = (e.touches ? e.touches[0].clientX : e.clientX) - handle.offsetLeft;
    handle.style.transition = 'none';
  }

  function onMove(e) {
    if (!isDragging) return;
    let currentX = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
    if (currentX < 4) currentX = 4;
    if (currentX > maxSlide) currentX = maxSlide;
    handle.style.left = currentX + 'px';
  }

  function onEnd() {
    if (!isDragging) return;
    isDragging = false;
    handle.style.transition = 'left 0.2s ease-out';
    let currentLeft = parseInt(handle.style.left) || 4;

    if (currentLeft >= maxSlide * 0.8) {
      handle.style.left = maxSlide + 'px';
      setTimeout(() => {
        handleAction(name, staff, todayDate);
      }, 150);
    } else {
      handle.style.left = '4px';
    }
  }

  handle.addEventListener('mousedown', onStart);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onEnd);

  handle.addEventListener('touchstart', onStart, { passive: true });
  document.addEventListener('touchmove', onMove, { passive: true });
  document.addEventListener('touchend', onEnd);
}

function handleAction(name, staff, todayDate) {
let now = new Date();
let currentTime = now.toTimeString().split(' ')[0];

if (staff.status === 'BS') {
staff.bStart = currentTime;
staff.bStartTimeFull = now.toISOString();
staff.status = 'BE';
} else if (staff.status === 'BE') {
staff.bEnd = currentTime;
staff.status = 'LS';
} else if (staff.status === 'LS') {
staff.lStart = currentTime;
staff.lStartTimeFull = now.toISOString();
staff.status = 'LE';
} else if (staff.status === 'LE') {
staff.lEnd = currentTime;
staff.status = 'DONE';
}

const dataRef = window.dbRef(window.db, 'breaks/' + todayDate + '/' + name);
window.dbSet(dataRef, staff);
}

function renderInchargeDashboard(mainApp, todayDate) {
if (globalTimerInterval) clearInterval(globalTimerInterval);
const todayBreaksRef = window.dbRef(window.db, 'breaks/' + todayDate);

window.dbOnValue(todayBreaksRef, (snapshot) => {
let dayData = snapshot.val() || {};

let cardsHtml = '';
STAFF_LIST.forEach((staffName, index) => {
let s = dayData[staffName] || { bStart: '--:--', bEnd: '--:--', lStart: '--:--', lEnd: '--:--', status: 'BS' };

let statusText = "Not Started";
let badgeClass = "badge-bs";
if (s.status === 'BE') { statusText = "On Breakfast Break"; badgeClass = "badge-be"; }
else if (s.status === 'LS') { statusText = "Breakfast Finished"; badgeClass = "badge-ls"; }
else if (s.status === 'LE') { statusText = "On Lunch Break"; badgeClass = "badge-le"; }
else if (s.status === 'DONE') { statusText = "All Breaks Completed"; badgeClass = "badge-done"; }

let bDur = (s.bStart !== '--:--' && s.bEnd !== '--:--') ? calculateStaticDuration(s.bStart, s.bEnd) : (s.bStart !== '--:--' ? 'Ongoing' : '--');
let lDur = (s.lStart !== '--:--' && s.lEnd !== '--:--') ? calculateStaticDuration(s.lStart, s.lEnd) : (s.lStart !== '--:--' ? 'Ongoing' : '--');

let totalMins = 0;
if (s.bStart !== '--:--' && s.bEnd !== '--:--') totalMins += getMinutes(s.bStart, s.bEnd);
if (s.lStart !== '--:--' && s.lEnd !== '--:--') totalMins += getMinutes(s.lStart, s.lEnd);
let tHrs = Math.floor(totalMins / 60);
let tRem = totalMins % 60;
let totalDurStr = totalMins > 0 ? (tHrs > 0 ? `${tHrs}h ${tRem}m` : `${tRem}m`) : '--';

cardsHtml += `
<div class="staff-dashboard-card">
<div class="staff-card-top">
<div class="staff-card-name">${index + 1}. ${staffName}</div>
<span class="status-badge ${badgeClass}">${statusText}</span>
</div>
<div class="dashboard-break-info">
<span>Breakfast: <b>${s.bStart} &rarr; ${s.bEnd}</b></span>
<span style="color:var(--primary); font-weight:600;">(${bDur})</span>
</div>
<div class="dashboard-break-info">
<span>Lunch: <b>${s.lStart} &rarr; ${s.lEnd}</b></span>
<span style="color:var(--primary); font-weight:600;">(${lDur})</span>
</div>
<div class="dashboard-total-box">
<span>Total Break Time:</span>
<span>${totalDurStr}</span>
</div>
</div>
`;
});

let isLogged = sessionStorage.getItem('sci_incharge_logged') === 'true';

let controlsHtml = '';
if (isLogged) {
let optionsHtml = '<option value="">-- Select Staff for History & PDF --</option>';
STAFF_LIST.forEach(name => {
optionsHtml += `<option value="${name}">${name}</option>`;
});

controlsHtml = `
<div class="incharge-controls">
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
<span style="font-weight: 700; color: var(--primary-dark);">In-Charge Controls:</span>
<select id="staffHistorySelect" onchange="if(this.value) window.location.href='?role=incharge&staff_history=' + encodeURIComponent(this.value)">
${optionsHtml}
</select>
</div>
<button class="btn-back" style="background: var(--danger);" onclick="logoutIncharge()">Logout</button>
</div>
`;

window.openPasswordModal = function() {
const modalHTML = `
<div class="modal-overlay" id="loginModal">
<div class="modal-box">
<h3>Unit Incharge Login</h3>
<input type="password" id="modalPasswordInput" class="modal-input" placeholder="Enter Password" autofocus>
<div class="modal-btns">

<button class="modal-btn modal-btn-confirm" onclick="verifyPassword()">Login</button>
</div>
</div>
</div>
`;
document.body.insertAdjacentHTML('beforeend', modalHTML);

let pwdInput = document.getElementById('modalPasswordInput');
if(pwdInput) {
pwdInput.onkeypress = (e) => {
if(e.key === 'Enter') verifyPassword();
};
}
};

window.closePasswordModal = function() {
let modal = document.getElementById('loginModal');
if(modal) modal.remove();
};

window.verifyPassword = function() {
let pwdInput = document.getElementById('modalPasswordInput');
if(pwdInput && pwdInput.value === INCHARGE_PASSWORD) {
sessionStorage.setItem('sci_incharge_logged', 'true');
closePasswordModal();
window.location.href = "?role=incharge";
} else {
alert("Incorrect Password!");
if(pwdInput) { pwdInput.value = ''; pwdInput.focus(); }
}
};

window.logoutIncharge = function() {
sessionStorage.removeItem('sci_incharge_logged');
window.location.href = "?role=incharge";
};

function renderStaffHistoryView(targetStaff, mainApp, todayDate) {
if (globalTimerInterval) clearInterval(globalTimerInterval);
const allBreaksRef = window.dbRef(window.db, 'breaks');

window.dbOnValue(allBreaksRef, (snapshot) => {
let allData = snapshot.val() || {};

function buildTableRows(fromDate, toDate) {
let rows = '';
let sortedDates = Object.keys(allData).sort();

sortedDates.forEach(dateKey => {
if (fromDate && dateKey < fromDate) return;
if (toDate && dateKey > toDate) return;

let dayStaffs = allData[dateKey];
if (dayStaffs && dayStaffs[targetStaff]) {
let s = dayStaffs[targetStaff];

let bDur = (s.bStart !== '--:--' && s.bEnd !== '--:--') ? calculateStaticDuration(s.bStart, s.bEnd) : '--';
let lDur = (s.lStart !== '--:--' && s.lEnd !== '--:--') ? calculateStaticDuration(s.lStart, s.lEnd) : '--';

let totalMins = 0;
if (s.bStart !== '--:--' && s.bEnd !== '--:--') totalMins += getMinutes(s.bStart, s.bEnd);
if (s.lStart !== '--:--' && s.lEnd !== '--:--') totalMins += getMinutes(s.lStart, s.lEnd);
let tHrs = Math.floor(totalMins / 60);
let tRem = totalMins % 60;
let tDur = tHrs > 0 ? `${tHrs}h ${tRem}m` : `${tRem}m`;

rows += `
<tr>
<td><b>${dateKey}</b></td>
<td>${s.bStart} &rarr; ${s.bEnd}<br><span style="color:var(--primary); font-weight:600;">(${bDur})</span></td>
<td>${s.lStart} &rarr; ${s.lEnd}<br><span style="color:var(--primary); font-weight:600;">(${lDur})</span></td>
<td><b>${tDur}</b></td>
</tr>
`;
}
});
return rows || '<tr><td colspan="4" style="padding: 30px; color: #64748b;">No break history found for the selected range.</td></tr>';
}

mainApp.innerHTML = `
<div class="incharge-container history-view">
<div class="history-title-bar">
<div class="incharge-header-left">
<div class="app-logo" style="width:45px; height:45px;">${plateCutleryIconSVG}</div>
<div>
<h2 id="pdfStaffName">${targetStaff}</h2>
<div class="date-badge" style="font-size: 13px; color: #64748b; margin-top: 2px;">Break History & PDF Report</div>
</div>
</div>
<button class="btn-back" onclick="window.location.href='?role=incharge'">&larr; Back to Dashboard</button>
</div>

<div class="filter-box">
<div>
<label>From:</label>
<input type="date" id="filterFrom">
</div>
<div>
<label>To:</label>
<input type="date" id="filterTo">
</div>
<button class="btn-pdf" id="downloadPdfBtn">Download PDF Report</button>
</div>

<div class="table-responsive" id="pdfTableContainer">
<div style="display:none; margin-bottom:15px; text-align:center;" id="pdfHeaderInfo">
<h3>Sharjah Charity International - Dialysis Center</h3>
<p>Staff Break Report: <b>${targetStaff}</b></p>
</div>
<table>
<thead>
<tr>
<th>Date</th>
<th>Breakfast Break</th>
<th>Lunch Break</th>
<th>Total Break Time</th>
</tr>
</thead>
<tbody id="tableBodyContent">
${buildTableRows('', '')}
</tbody>
</table>
</div>
</div>
`;

let fromInput = document.getElementById('filterFrom');
let toInput = document.getElementById('filterTo');
let tbody = document.getElementById('tableBodyContent');

function updateFilter() {
tbody.innerHTML = buildTableRows(fromInput.value, toInput.value);
}

if(fromInput) fromInput.onchange = updateFilter;
if(toInput) toInput.onchange = updateFilter;

let downloadBtn = document.getElementById('downloadPdfBtn');
if(downloadBtn) {
downloadBtn.onclick = () => {
let element = document.getElementById('pdfTableContainer');
let pdfHeader = document.getElementById('pdfHeaderInfo');
pdfHeader.style.display = 'block';

let opt = {
margin: 10,
filename: `${targetStaff}_Break_Report.pdf`,
image: { type: 'jpeg', quality: 0.98 },
html2canvas: { scale: 2 },
jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
};

html2pdf().from(element).set(opt).save().then(() => {
pdfHeader.style.display = 'none';
});
};
}

}, { onlyOnce: false });
}
</script>
